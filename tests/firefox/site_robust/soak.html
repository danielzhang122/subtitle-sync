<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>subtitle-sync: soak</title></head>
<body>
<video id="v" src="/movie.mp4" muted style="width:320px"></video>
<script src="/content/sync-core.js"></script>
<script>
// A 3-hour viewing fed straight into the extension's own audio-sync code, plus the cost of redrawing the
// subtitle track the way content/video.js fill() does.
const { SyncEstimator, SyncPolicy, offsetAt, applySync } = globalThis.__subsync;
const HOURS = 3, END = HOURS * 3600000, STEP = 5000;
let x = 11;
const rnd = () => ((x = (x * 1103515245 + 12345) % 2147483648) / 2147483648);
const truth = [];
for (let t = 3000; t < END;) { const d = 1000 + rnd() * 3500; truth.push([t, t + d]); t += d + 300 + rnd() * 3200; }
const pct = (a, p) => { const y = [...a].sort((u, v) => u - v); return y[Math.min(y.length - 1, Math.floor(p * y.length))]; };

function viewing(k) {
  const est = new SyncEstimator();
  est.setCues(truth.map(([a, b]) => ({ start: (a + 1200) / k, end: (b + 1500) / k, text: "words" })), () => false);
  const pol = new SyncPolicy(false, { track: true });
  const tm = { scale: 1, segments: [{ from: 0, offset: 0 }] };
  let i = 0, q = 0, lock = null;
  const ms = [], kinds = {}, errs = [];
  const BLOCK = 1024 / 48;
  for (let now = STEP; now <= END; now += STEP) {
    for (; (i + 1) * BLOCK <= now; i++) {
      const m = i * BLOCK;
      while (q < truth.length && truth[q][1] <= m) q++;
      const talking = q < truth.length && m >= truth[q][0];
      est.addAudio(m, m + BLOCK, (talking ? -24 : -50) + (rnd() - 0.5) * 10);
    }
    const t0 = performance.now();
    const current = Math.round(offsetAt(tm.segments, now));
    const { action } = pol.step(est, now, current, tm.scale);
    ms.push(performance.now() - t0);
    if (action) {
      applySync(tm, action, now);
      kinds[action.kind] = (kinds[action.kind] || 0) + 1;
      if (action.kind === "lock") lock = now;
    }
    if (lock !== null && now > lock + 300000) {
      // film time m -> published time: (m + 1200) / k; the offset is relative to that
      const p = (now + 1200) / k;
      errs.push(Math.abs(p * tm.scale + offsetAt(tm.segments, p) - now));
    }
  }
  return { k, lockS: lock && lock / 1000, kinds, segments: tm.segments.length, scale: tm.scale,
    segmentsJson: JSON.stringify(tm.segments).length, energyMB: +(est.energy.byteLength / 1048576).toFixed(1),
    stepMs: { median: +pct(ms, 0.5).toFixed(1), p99: +pct(ms, 0.99).toFixed(1), max: +Math.max(...ms).toFixed(1) },
    errMs: { median: Math.round(pct(errs, 0.5)), p95: Math.round(pct(errs, 0.95)), worst: Math.round(Math.max(...errs)) } };
}

// Redraw as fill() does: remove every cue, make every cue again with the offset looked up in the segments.
async function fillCost(nSegments) {
  const v = document.getElementById("v");
  await v.play();
  const track = v.addTextTrack("subtitles", "soak", "und");
  track.mode = "showing";
  const cues = truth.slice(0, 1500).map(([a, b], n) => ({ start: n * 500, end: n * 500 + 2000, text: "words words words" })); // always one on screen
  const segments = [{ from: 0, offset: 0 }];
  for (let n = 1; n < nSegments; n++) segments.push({ from: n * 30000, offset: 0 });
  const fill = () => {
    for (const c of [...(track.cues || [])]) track.removeCue(c);
    for (const c of cues) {
      const a = (c.start + offsetAt(segments, c.start)) / 1000, b = (c.end + offsetAt(segments, c.end)) / 1000;
      const cue = new VTTCue(Math.max(0, a), b, c.text);
      cue.snapToLines = false; cue.line = 90; cue.lineAlign = "end";
      track.addCue(cue);
    }
  };
  fill();
  let changes = 0;
  track.addEventListener("cuechange", () => { changes++; });
  const wait = (t) => new Promise((r) => setTimeout(r, t));
  await wait(1000);
  const ms = [];
  let emptyAfter0 = 0, emptyAfter100 = 0, n = 15;
  const startChanges = changes;
  for (let r = 0; r < n; r++) {
    const t0 = performance.now();
    fill();
    ms.push(performance.now() - t0);
    await wait(0);
    if (!track.activeCues?.length) emptyAfter0++;
    await wait(100);
    if (!track.activeCues?.length) emptyAfter100++;
    await wait(400);
  }
  track.mode = "disabled";
  v.pause();
  return { segments: nSegments, cues: cues.length, fillMs: { median: +pct(ms, 0.5).toFixed(1), max: +Math.max(...ms).toFixed(1) },
    rounds: n, noLineJustAfter: emptyAfter0, noLineAfter100ms: emptyAfter100, cuechangeEvents: changes - startChanges };
}

setTimeout(async () => {
  const views = [viewing(1), viewing(1.0003), viewing(1.002)];
  const fills = [await fillCost(1), await fillCost(300)];
  window.RESULT = { views, fills };
}, 0);
</script>
</body></html>
